<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deusa 7 - Área de Acesso</title>
  <!-- SDK Oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #e0a96d; /* Tom dourado Deusa 7 */
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: #e0a96d;
      color: #121212;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #c89355;
    }
    #mensagem {
      margin-top: 15px;
      font-size: 14px;
    }
    .sucesso { color: #4caf50; }
    .erro { color: #f44336; }
    .escondido { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Deusa 7</h1>
    <p>Digita o teu e-mail de compra para acederes ao conteúdo.</p>
    
    <input type="email" id="emailCliente" placeholder="O teu e-mail da Hotmart" required>
    <button onclick="verificarAcesso()">Verificar Acesso</button>

    <div id="mensagem"></div>

    <!-- Conteúdo exclusivo protegido -->
    <div id="conteudoExclusivo" class="escondido" style="margin-top: 25px; border-top: 1px solid #333; padding-top: 20px;">
      <h2>Bem-vinda à Deusa 7!</h2>
      <p>O teu acesso está ativo e confirmado.</p>
      <!-- Podes colocar aqui os teus links, vídeos ou materiais exclusivos -->
    </div>
  </div>

  <script>
    // Credenciais configuradas do teu projeto Supabase
    const SUPABASE_URL = 'https://plvncoygvdxhwnphlznz.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_HXm2W9qGgPQLqh30MUNbbQ_rSs825Q1'

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    async function verificarAcesso() {
      const email = document.getElementById('emailCliente').value.trim()
      const msgDiv = document.getElementById('mensagem')
      const conteudoDiv = document.getElementById('conteudoExclusivo')

      msgDiv.innerHTML = ''
      conteudoDiv.classList.add('escondido')

      if (!email) {
        msgDiv.className = 'erro'
        msgDiv.innerText = 'Por favor, digita o teu e-mail.'
        return
      }

      msgDiv.innerText = 'A verificar o teu acesso...'

      // Consulta a tabela VENDAS no Supabase
      const { data, error } = await supabaseClient
        .from('VENDAS')
        .select('*')
        .eq('email', email)
        .eq('status', 'APPROVED')
        .maybeSingle()

      if (error) {
        console.error('Erro na consulta:', error)
        msgDiv.className = 'erro'
        msgDiv.innerText = 'Erro ao consultar o sistema. Tenta novamente.'
        return
      }

      if (data) {
        msgDiv.className = 'sucesso'
        msgDiv.innerText = 'Acesso confirmado com sucesso!'
        conteudoDiv.classList.remove('escondido')
      } else {
        msgDiv.className = 'erro'
        msgDiv.innerText = 'Nenhum pagamento aprovado encontrado para este e-mail.'
      }
    }
  </script>

</body>
</html>
